name: ${COMPOSE_PROJECT_NAME:-homelab}

volumes:
  sandbox-tls:

services:
  caddy:
    image: caddy:2-alpine
    container_name: homelab-caddy
    restart: unless-stopped
    environment:
      BASE_DOMAIN: ${BASE_DOMAIN:?Set BASE_DOMAIN in .env}
      ACME_EMAIL: ${ACME_EMAIL:?Set ACME_EMAIL in .env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./caddy/data:/data
      - ./caddy/config:/config
    networks:
      - proxy
    depends_on:
      - homepage
      - uptime-kuma
      - beszel
      - n8n
      - homeassistant

  homepage:
    image: ghcr.io/gethomepage/homepage:latest
    container_name: homelab-homepage
    restart: unless-stopped
    environment:
      HOMEPAGE_ALLOWED_HOSTS: ${HOMEPAGE_ALLOWED_HOSTS:?Set HOMEPAGE_ALLOWED_HOSTS in .env}
      HOMEPAGE_VAR_BASE_DOMAIN: ${BASE_DOMAIN:?Set BASE_DOMAIN in .env}
    volumes:
      - ./homepage:/app/config
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - proxy

  uptime-kuma:
    image: louislam/uptime-kuma:2
    container_name: homelab-uptime-kuma
    restart: unless-stopped
    volumes:
      - ./uptime-kuma:/app/data
    networks:
      - proxy

  beszel:
    image: henrygd/beszel:latest
    container_name: homelab-beszel
    restart: unless-stopped
    environment:
      APP_URL: https://beszel.${BASE_DOMAIN:?Set BASE_DOMAIN in .env}
    ports:
      - "127.0.0.1:8090:8090"
    volumes:
      - ./beszel/data:/beszel_data
      - ./beszel/socket:/beszel_socket
    networks:
      - proxy
    healthcheck:
      test: ["CMD", "/beszel", "health", "--url", "http://localhost:8090"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s

  beszel-agent:
    image: henrygd/beszel-agent:latest
    container_name: homelab-beszel-agent
    restart: unless-stopped
    profiles:
      - beszel-agent
    network_mode: host
    volumes:
      - ./beszel/agent:/var/lib/beszel-agent
      - ./beszel/socket:/beszel_socket
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      LISTEN: /beszel_socket/beszel.sock
      HUB_URL: http://127.0.0.1:8090
      TOKEN: ${BESZEL_AGENT_TOKEN:?Set BESZEL_AGENT_TOKEN after creating the system in Beszel}
      KEY: ${BESZEL_AGENT_KEY:?Set BESZEL_AGENT_KEY after creating the system in Beszel}
    depends_on:
      beszel:
        condition: service_healthy

  # n8n AI Assistant code sandbox. Keep all sandbox services internal;
  # only n8n itself is exposed through Caddy.
  sandbox-certs:
    image: ghcr.io/n8n-io/n8n-sandbox-service-api:${N8N_SANDBOX_VERSION:-latest}
    user: "0:0"
    restart: "no"
    entrypoint: ["sh", "-c"]
    command:
      - >
        bootstrap-mtls.sh --out-dir /tls --api-san sandbox-api
        --control-san-prefix sandbox-runner --world-readable &&
        chown -R sandbox-api:sandbox-api /tls/api && chmod -R a+rX /tls
    environment:
      NUM_RUNNERS: "1"
    volumes:
      - sandbox-tls:/tls
    networks:
      - proxy

  sandbox-api:
    image: ghcr.io/n8n-io/n8n-sandbox-service-api:${N8N_SANDBOX_VERSION:-latest}
    restart: unless-stopped
    depends_on:
      sandbox-certs:
        condition: service_completed_successfully
    environment:
      SANDBOX_API_KEYS: ${SANDBOX_API_KEYS:?Set SANDBOX_API_KEYS in .env}
      SANDBOX_API_RUNNER_REGISTRATION_TOKEN: ${SANDBOX_API_RUNNER_REGISTRATION_TOKEN:?Set SANDBOX_API_RUNNER_REGISTRATION_TOKEN in .env}
      SANDBOX_API_RUNNER_API_KEY: ${SANDBOX_API_RUNNER_API_KEY:?Set SANDBOX_API_RUNNER_API_KEY in .env}
      SANDBOX_API_GRPC_TLS_CERT_FILE: /tls/api/grpc-server.crt
      SANDBOX_API_GRPC_TLS_KEY_FILE: /tls/api/grpc-server.key
      SANDBOX_API_GRPC_TLS_CLIENT_CA_FILE: /tls/api/ca.crt
      SANDBOX_API_RUNNER_CONTROL_GRPC_TLS_CA_FILE: /tls/api/ca.crt
      SANDBOX_API_RUNNER_CONTROL_GRPC_TLS_CERT_FILE: /tls/api/control-grpc-api-client.crt
      SANDBOX_API_RUNNER_CONTROL_GRPC_TLS_KEY_FILE: /tls/api/control-grpc-api-client.key
      SANDBOX_API_RUNNER_CONTROL_GRPC_TLS_SERVER_NAME: sandbox-runner-1
    volumes:
      - sandbox-tls:/tls:ro
    networks:
      - proxy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

  sandbox-runner-1:
    image: ghcr.io/n8n-io/n8n-sandbox-service-runner-dind:${N8N_SANDBOX_VERSION:-latest}
    restart: unless-stopped
    privileged: true
    depends_on:
      sandbox-api:
        condition: service_healthy
    environment:
      SANDBOX_RUNNER_API_KEYS: ${SANDBOX_API_RUNNER_API_KEY:?Set SANDBOX_API_RUNNER_API_KEY in .env}
      SANDBOX_RUNNER_REGISTRATION_TOKEN: ${SANDBOX_API_RUNNER_REGISTRATION_TOKEN:?Set SANDBOX_API_RUNNER_REGISTRATION_TOKEN in .env}
      SANDBOX_RUNNER_API_GRPC_ADDR: sandbox-api:9090
      SANDBOX_RUNNER_HTTP_BASE_URL: https://sandbox-runner-1:8080
      SANDBOX_RUNNER_CONTROL_GRPC_LISTEN_ADDR: ":9091"
      SANDBOX_RUNNER_CONTROL_GRPC_ADVERTISE_ADDR: sandbox-runner-1:9091
      SANDBOX_RUNNER_ID: runner-1
      SANDBOX_RUNNER_DOCKER_SANDBOX_IMAGE: ghcr.io/n8n-io/n8n-sandbox-service-sandbox:${N8N_SANDBOX_VERSION:-latest}
      SANDBOX_RUNNER_REGISTRATION_GRPC_CA_FILE: /tls/runner/ca.crt
      SANDBOX_RUNNER_REGISTRATION_GRPC_CERT_FILE: /tls/runner/grpc-client.crt
      SANDBOX_RUNNER_REGISTRATION_GRPC_KEY_FILE: /tls/runner/grpc-client.key
      SANDBOX_RUNNER_REGISTRATION_GRPC_SERVER_NAME: sandbox-api
      SANDBOX_RUNNER_CONTROL_GRPC_TLS_CERT_FILE: /tls/runner/control-grpc-server.crt
      SANDBOX_RUNNER_CONTROL_GRPC_TLS_KEY_FILE: /tls/runner/control-grpc-server.key
      SANDBOX_RUNNER_CONTROL_GRPC_TLS_CLIENT_CA_FILE: /tls/runner/ca.crt
    volumes:
      - sandbox-tls:/tls:ro
    networks:
      - proxy

  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: homelab-n8n
    restart: unless-stopped
    depends_on:
      sandbox-api:
        condition: service_healthy
    environment:
      N8N_HOST: ${N8N_HOST:?Set N8N_HOST in .env}
      N8N_PORT: 5678
      N8N_PROTOCOL: https
      NODE_ENV: production
      WEBHOOK_URL: ${N8N_WEBHOOK_URL:?Set N8N_WEBHOOK_URL in .env}
      N8N_EDITOR_BASE_URL: ${N8N_EDITOR_BASE_URL:?Set N8N_EDITOR_BASE_URL in .env}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?Set N8N_ENCRYPTION_KEY in .env}
      N8N_SECURE_COOKIE: "true"
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      N8N_INSTANCE_AI_SANDBOX_ENABLED: "true"
      N8N_INSTANCE_AI_SANDBOX_PROVIDER: n8n-sandbox
      N8N_SANDBOX_SERVICE_URL: http://sandbox-api:8080
      N8N_SANDBOX_SERVICE_API_KEY: ${N8N_SANDBOX_SERVICE_API_KEY:?Set N8N_SANDBOX_SERVICE_API_KEY in .env}
      GENERIC_TIMEZONE: ${TZ:-Asia/Shanghai}
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - ./n8n:/home/node/.n8n
      - ./n8n/files:/files
    networks:
      - proxy

  homeassistant:
    image: ghcr.io/home-assistant/home-assistant:stable
    container_name: homelab-homeassistant
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - ./home-assistant:/config
    networks:
      - proxy

networks:
  proxy:
    name: homelab-proxy
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/24
