default_config:

automation: !include automations.yaml

rest_command:
  n8n_ha_event:
    url: "https://n8n.dmall.ink/webhook-test/ha-events"
    method: post
    headers:
      X-Homelab-Webhook: !secret n8n_ha_webhook_token
    content_type: "application/json"
    payload: >-
      {{
        {
          "entity_id": entity_id,
          "from_state": from_state,
          "to_state": to_state,
          "friendly_name": friendly_name,
          "changed_at": changed_at
        } | to_json
      }}
